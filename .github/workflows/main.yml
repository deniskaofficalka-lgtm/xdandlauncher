name: Build and Release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: "--win"
          - os: ubuntu-latest
            target: "--linux deb AppImage"
          - os: macos-latest
            target: "--mac dmg --x64"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16

      # Создаем сертификат ТОЛЬКО на Windows и подключаем его только туда
      - name: Create Self-Signed Certificate
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=xDand Team" -CertStoreLocation Cert:\CurrentUser\My
          $pwd = ConvertTo-SecureString -String "xDandSecret123" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath cert.pfx -Password $pwd
          "CSC_LINK=cert.pfx" >> $env:GITHUB_ENV
          "CSC_KEY_PASSWORD=xDandSecret123" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install electron-builder@23.6.0 --save-dev --legacy-peer-deps

      # Сборка: на Windows подхватятся переменные из GITHUB_ENV, а на Mac/Linux их не будет
      - name: Build and Publish to Release
        run: npx electron-builder ${{ matrix.target }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
